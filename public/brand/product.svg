<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <circle cx="1455" cy="110" r="190" fill="#EEF2FF"/>
  <circle cx="120" cy="820" r="220" fill="#EFF6FF"/>

  <!-- Brand / copy -->
  <g transform="translate(108 104)">
    <rect width="72" height="72" rx="18" fill="#111827"/>
    <text x="36" y="47" text-anchor="middle" fill="white" font-size="32" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">S2</text>
    <text x="0" y="132" fill="#111827" font-size="64" font-weight="800" letter-spacing="-2.2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Your data,</text>
    <text x="0" y="202" fill="#111827" font-size="64" font-weight="800" letter-spacing="-2.2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">on your terms.</text>
    <text x="0" y="258" fill="#64748B" font-size="24" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Self-hosted, path-scoped storage</text>
    <text x="0" y="292" fill="#64748B" font-size="24" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">for personal data.</text>
    <text x="0" y="332" fill="#64748B" font-size="20" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Files stay simple. Access stays scoped.</text>

    <g transform="translate(0 382)">
      <rect x="0" y="0" width="112" height="42" rx="21" fill="#111827"/>
      <text x="56" y="27" text-anchor="middle" fill="#F9FAFB" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">REST API</text>
      <rect x="124" y="0" width="116" height="42" rx="21" fill="white" stroke="#D1D5DB"/>
      <text x="182" y="27" text-anchor="middle" fill="#374151" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">WebDAV</text>
      <rect x="252" y="0" width="104" height="42" rx="21" fill="white" stroke="#D1D5DB"/>
      <text x="304" y="27" text-anchor="middle" fill="#374151" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">OAuth</text>
      <rect x="368" y="0" width="84" height="42" rx="21" fill="white" stroke="#D1D5DB"/>
      <text x="410" y="27" text-anchor="middle" fill="#374151" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">MCP</text>
    </g>

    <g transform="translate(0 474)">
      <rect width="390" height="132" rx="20" fill="white" stroke="#E2E8F0"/>
      <circle cx="34" cy="34" r="10" fill="#60A5FA"/>
      <text x="58" y="40" fill="#111827" font-size="18" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Path-scoped access</text>
      <text x="30" y="78" fill="#475569" font-size="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/agents/research/*</text>
      <rect x="28" y="95" width="154" height="22" rx="11" fill="#EFF6FF"/>
      <text x="105" y="111" text-anchor="middle" fill="#2563EB" font-size="12" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">READ + WRITE ONLY HERE</text>
    </g>
  </g>

  <!-- App window -->
  <g transform="translate(665 94)">
    <rect x="0" y="0" width="835" height="710" rx="28" fill="#0F172A" opacity="0.10"/>
    <rect x="-14" y="-14" width="835" height="710" rx="28" fill="white" stroke="#CBD5E1"/>

    <!-- titlebar -->
    <rect x="-14" y="-14" width="835" height="54" rx="28" fill="#FFFFFF"/>
    <circle cx="18" cy="13" r="7" fill="#FCA5A5"/>
    <circle cx="42" cy="13" r="7" fill="#FCD34D"/>
    <circle cx="66" cy="13" r="7" fill="#86EFAC"/>
    <rect x="280" y="2" width="238" height="24" rx="12" fill="#F1F5F9"/>
    <text x="399" y="18" text-anchor="middle" fill="#64748B" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">s2.local/files</text>

    <!-- sidebar -->
    <rect x="-14" y="40" width="216" height="642" fill="#111827"/>
    <text x="18" y="88" fill="#FFFFFF" font-size="25" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">S2</text>
    <line x1="-14" y1="112" x2="202" y2="112" stroke="#374151"/>

    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif" font-size="15" font-weight="600">
      <rect x="2" y="132" width="184" height="42" rx="8" fill="#374151"/>
      <rect x="18" y="146" width="14" height="14" rx="2" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="46" y="160" fill="#FFFFFF">My Files</text>

      <circle cx="25" cy="208" r="7" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="46" y="214" fill="#D1D5DB">API Tokens</text>

      <rect x="18" y="246" width="14" height="14" rx="3" stroke="#9CA3AF" stroke-width="1.5"/>
      <path d="M22 250h6M22 254h6" stroke="#9CA3AF" stroke-width="1.3" stroke-linecap="round"/>
      <text x="46" y="258" fill="#D1D5DB">Connections</text>

      <circle cx="25" cy="296" r="7" stroke="#9CA3AF" stroke-width="1.5"/>
      <path d="M25 285v5M25 302v5M14 296h5M31 296h5" stroke="#9CA3AF" stroke-width="1.2"/>
      <text x="46" y="302" fill="#D1D5DB">Settings</text>

      <path d="M19 337h12v12H19z" stroke="#9CA3AF" stroke-width="1.5"/>
      <path d="M25 337v-4h10v10h-4" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="46" y="346" fill="#D1D5DB">Docs</text>
    </g>

    <g transform="translate(18 576)">
      <rect width="150" height="7" rx="3.5" fill="#374151"/>
      <rect width="48" height="7" rx="3.5" fill="#60A5FA"/>
      <text x="0" y="28" fill="#9CA3AF" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">18.4 GB used</text>
      <text x="0" y="56" fill="#E5E7EB" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">owner@example.com</text>
      <text x="0" y="82" fill="#9CA3AF" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Log out</text>
    </g>

    <!-- content -->
    <g transform="translate(230 78)">
      <text x="0" y="0" fill="#111827" font-size="26" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">My Files</text>
      <text x="0" y="46" fill="#111827" font-size="14" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Files</text>
      <text x="52" y="46" fill="#94A3B8" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Trash</text>
      <line x1="0" y1="59" x2="545" y2="59" stroke="#E5E7EB"/>
      <line x1="0" y1="58" x2="32" y2="58" stroke="#111827" stroke-width="2"/>

      <g transform="translate(282 82)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif" font-size="13" font-weight="700">
        <rect x="0" width="78" height="34" rx="7" fill="white" stroke="#D1D5DB"/>
        <text x="39" y="22" text-anchor="middle" fill="#374151">Folder</text>
        <rect x="88" width="88" height="34" rx="7" fill="white" stroke="#D1D5DB"/>
        <text x="132" y="22" text-anchor="middle" fill="#374151">Text file</text>
        <rect x="186" width="77" height="34" rx="7" fill="#111827"/>
        <text x="224.5" y="22" text-anchor="middle" fill="white">Upload</text>
      </g>

      <text x="0" y="132" fill="#94A3B8" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">6 items</text>

      <!-- file list -->
      <g transform="translate(0 152)">
        <rect width="545" height="336" rx="14" fill="white" stroke="#E2E8F0"/>
        <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
          <text x="54" y="32" fill="#94A3B8" font-size="11" font-weight="700">NAME</text>
          <text x="382" y="32" fill="#94A3B8" font-size="11" font-weight="700">SIZE</text>
          <text x="458" y="32" fill="#94A3B8" font-size="11" font-weight="700">UPDATED</text>
          <line x1="0" y1="50" x2="545" y2="50" stroke="#E2E8F0"/>

          <!-- row1 folder -->
          <g transform="translate(18 63)">
            <path d="M2 7h11l4 4h16v20H2z" fill="#DBEAFE" stroke="#60A5FA"/>
            <text x="40" y="23" fill="#111827" font-size="14" font-weight="650">agents</text>
            <text x="364" y="23" fill="#64748B" font-size="12">—</text>
            <text x="440" y="23" fill="#64748B" font-size="12">just now</text>
          </g>
          <line x1="0" y1="112" x2="545" y2="112" stroke="#F1F5F9"/>

          <g transform="translate(18 125)">
            <path d="M2 7h11l4 4h16v20H2z" fill="#E0E7FF" stroke="#818CF8"/>
            <text x="40" y="23" fill="#111827" font-size="14" font-weight="650">notes</text>
            <text x="364" y="23" fill="#64748B" font-size="12">—</text>
            <text x="440" y="23" fill="#64748B" font-size="12">2 min</text>
          </g>
          <line x1="0" y1="174" x2="545" y2="174" stroke="#F1F5F9"/>

          <g transform="translate(18 187)">
            <rect x="4" y="5" width="26" height="31" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
            <line x1="10" y1="14" x2="24" y2="14" stroke="#64748B"/>
            <line x1="10" y1="20" x2="24" y2="20" stroke="#94A3B8"/>
            <line x1="10" y1="26" x2="21" y2="26" stroke="#94A3B8"/>
            <text x="40" y="24" fill="#111827" font-size="14" font-weight="650">README.md</text>
            <text x="364" y="24" fill="#64748B" font-size="12">3.8 KB</text>
            <text x="440" y="24" fill="#64748B" font-size="12">12 min</text>
          </g>
          <line x1="0" y1="236" x2="545" y2="236" stroke="#F1F5F9"/>

          <g transform="translate(18 249)">
            <rect x="4" y="5" width="26" height="31" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
            <path d="M10 28l6-7 5 4 5-8" stroke="#60A5FA" stroke-width="1.7" fill="none"/>
            <text x="40" y="24" fill="#111827" font-size="14" font-weight="650">research.json</text>
            <text x="364" y="24" fill="#64748B" font-size="12">18 KB</text>
            <text x="440" y="24" fill="#64748B" font-size="12">1 hr</text>
          </g>
          <line x1="0" y1="298" x2="545" y2="298" stroke="#F1F5F9"/>

          <g transform="translate(18 304)">
            <text x="4" y="20" fill="#2563EB" font-size="12" font-weight="700">↳ scoped token: /agents/research/*</text>
            <rect x="285" y="4" width="76" height="24" rx="12" fill="#EFF6FF"/>
            <text x="323" y="20" text-anchor="middle" fill="#2563EB" font-size="11" font-weight="700">rw access</text>
          </g>
        </g>
      </g>

      <!-- path token callout -->
      <g transform="translate(24 515)">
        <rect width="497" height="94" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="29" cy="31" r="10" fill="#111827"/>
        <path d="M25 31h8M29 27v8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <text x="50" y="28" fill="#111827" font-size="13" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Grant access without granting everything</text>
        <text x="50" y="51" fill="#64748B" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">Share a path with an app, agent, or device.</text>
        <text x="50" y="73" fill="#2563EB" font-size="12" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">s2_••••  →  /agents/research/*</text>
      </g>
    </g>
  </g>

  <text x="108" y="846" fill="#94A3B8" font-size="14" font-weight="600" letter-spacing="1.2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">SELF-HOSTED • FILES • TOKENS • WEBDAV • MCP</text>
</svg>
